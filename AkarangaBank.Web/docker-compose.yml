version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: akaranga-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "fun123@"
      MYSQL_DATABASE: "Akarangabank"
      MYSQL_USER: "akaranga"
      MYSQL_PASSWORD: "fun123@"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  web:
    build:
      context: .
    container_name: akaranga-web
    depends_on:
      - db
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__AkarangaBank: "Server=db;Port=3306;Database=Akarangabank;User=akaranga;Password=fun123@;AllowPublicKeyRetrieval=True;SslMode=Preferred;"
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  mysql_data:
